<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Hansika Residential English Medium School, Tilakpada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="header-placeholder"></div>
    <div id="authpanel-placeholder"></div>

    <section class="kps-page-banner page-top-space">
        <div class="container">
            <div class="hrems-banner-grid">
                <div>
                    <span class="kps-badge">Contact Us</span>
                    <h1>We'd love to hear from you</h1>
                </div>
                <p>Reach Hansika Residential English Medium School for admissions, support, and school information.</p>
            </div>
        </div>
    </section>

    <section class="kps-section contact-redesign">
        <div class="container">
            <div class="hrems-contact-chips">
                <div class="kps-contact-info-item">
                    <i class="bi bi-geo-alt-fill"></i>
                    <p>Tilakpada, Kandhamal, Odisha</p>
                </div>
                <div class="kps-contact-info-item">
                    <i class="bi bi-envelope-fill"></i>
                    <p><a href="mailto:kingspublicschoolmkg@gmail.com" class="contact-link">kingspublicschoolmkg@gmail.com</a></p>
                </div>
                <div class="kps-contact-info-item">
                    <i class="bi bi-telephone-fill"></i>
                    <p><a href="tel:+919583344888" class="contact-link">+91 9583344888</a></p>
                </div>
                <div class="kps-contact-info-item">
                    <i class="bi bi-clock-fill"></i>
                    <p>Mon–Sat: 9:00 AM – 4:00 PM</p>
                </div>
            </div>

            <div class="hrems-contact-split">
                <div class="kps-contact-form">
                    <h4 class="mb-3">Send Enquiry</h4>
                    <form id="contactForm">
                        <div class="row g-3">
                            <div class="col-md-6"><input type="text" class="form-control" placeholder="Parent Name" required></div>
                            <div class="col-md-6"><input type="email" class="form-control" placeholder="Email Address" required></div>
                            <div class="col-md-6"><input type="tel" class="form-control" placeholder="+91 0000000000" required></div>
                            <div class="col-md-6"><input type="text" class="form-control" placeholder="Subject" required></div>
                            <div class="col-12"><textarea class="form-control" rows="5" placeholder="Write your message" required></textarea></div>
                            <div class="col-12"><button type="submit" class="btn btn-primary px-4">Submit Enquiry</button></div>
                        </div>
                    </form>
                </div>
                <div class="kps-contact-map-wrap">
                    <div class="ratio ratio-4x3 h-100">
                        <iframe src="https://www.google.com/maps?q=Tilakpada%2C%20Kandhamal%2C%20Odisha&output=embed" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <button id="backToTop" class="btn btn-primary back-to-top" type="button">
        <i class="bi bi-arrow-up"></i>
    </button>
    <a href="https://wa.me/911234567890" class="whatsapp-float" target="_blank" rel="noopener noreferrer" aria-label="Chat on WhatsApp">
        <i class="bi bi-whatsapp"></i>
    </a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/load-components.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
